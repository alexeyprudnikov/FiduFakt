memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60
date.timezone = Europe/Berlin

; Performance-Boost für Symfony
[opcache]
; Aktiviert den Opcache
opcache.enable=1
opcache.enable_cli=1
; Speicherplatz für vorkompilierten Code (Symfony ist groß, daher 256MB)
opcache.memory_consumption=256
; Speicher für interne Strings (Variablennamen etc.)
opcache.interned_strings_buffer=16
; Maximale Anzahl an Dateien (Symfony hat tausende kleine Dateien)
opcache.max_accelerated_files=20000
; In Produktion: Verhindert, dass PHP ständig prüft, ob Dateien geändert wurden.
; Das spart massiv I/O-Last (Festplattenzugriffe).
opcache.validate_timestamps=0
; Schnelles Herunterfahren von Prozessen
opcache.fast_shutdown=1
; JIT aktivieren (nur PHP 8.x)
opcache.jit_buffer_size=100M
opcache.jit=tracing

realpath_cache_size = 4096K
realpath_cache_ttl = 600
